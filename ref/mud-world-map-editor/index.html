
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>MUD World Map Editor</title>
<style>
body { font-family: Arial, sans-serif; margin:0; display:flex; height:100vh; }
#sidebar { width:300px; border-right:1px solid #ccc; padding:10px; overflow:auto; }
#canvas { flex:1; position:relative; }
.node {
  position:absolute;
  padding:6px 10px;
  border:1px solid #333;
  border-radius:6px;
  background:#eee;
  cursor:move;
}
button { margin:4px 0; width:100%; }
textarea { width:100%; height:120px; }
</style>
</head>
<body>

<div id="sidebar">
<h3>World Map Editor</h3>

<button onclick="addNode()">Add Area</button>
<button onclick="exportGraph()">Export world-graph.json</button>
<button onclick="importGraph()">Import JSON</button>

<h4>JSON</h4>
<textarea id="json"></textarea>

</div>

<div id="canvas"></div>

<script>

let nodes = []
let edges = []
let idCounter = 1

function addNode(){
  const id = "area_" + idCounter++
  const node = {id:id,label:id,type:"area",x:100,y:100}
  nodes.push(node)
  drawNode(node)
}

function drawNode(node){
  const div = document.createElement("div")
  div.className="node"
  div.innerText=node.label
  div.style.left=node.x+"px"
  div.style.top=node.y+"px"
  div.dataset.id=node.id

  div.onmousedown=function(e){
    const startX=e.clientX
    const startY=e.clientY

    const startLeft=parseInt(div.style.left)
    const startTop=parseInt(div.style.top)

    function move(ev){
      div.style.left=startLeft+(ev.clientX-startX)+"px"
      div.style.top=startTop+(ev.clientY-startY)+"px"
      updateNodePosition(node.id,div)
    }

    function up(){
      document.removeEventListener("mousemove",move)
      document.removeEventListener("mouseup",up)
    }

    document.addEventListener("mousemove",move)
    document.addEventListener("mouseup",up)
  }

  document.getElementById("canvas").appendChild(div)
}

function updateNodePosition(id,div){
  const n = nodes.find(n=>n.id===id)
  n.x=parseInt(div.style.left)
  n.y=parseInt(div.style.top)
}

function exportGraph(){

  const graph={
    nodes:nodes.map(n=>({
      id:n.id,
      label:n.label,
      type:n.type
    })),
    edges:edges
  }

  document.getElementById("json").value=JSON.stringify(graph,null,2)
}

function importGraph(){

  try{

    const data=JSON.parse(document.getElementById("json").value)

    nodes=[]
    edges=data.edges||[]

    document.getElementById("canvas").innerHTML=""

    data.nodes.forEach(n=>{
      const node={...n,x:100,y:100}
      nodes.push(node)
      drawNode(node)
    })

  }catch(e){
    alert("Invalid JSON")
  }
}

</script>

</body>
</html>
