
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>MUD World Map Editor Pro</title>
<style>
body { font-family: Arial; margin:0; display:flex; height:100vh; }
#sidebar { width:320px; border-right:1px solid #ccc; padding:10px; overflow:auto; }
#canvas { flex:1; position:relative; background:#fafafa; }
.node {
  position:absolute;
  padding:6px 10px;
  border:1px solid #333;
  border-radius:6px;
  background:#e8e8e8;
  cursor:move;
  user-select:none;
}
.edge {
  position:absolute;
  pointer-events:none;
}
button { margin:4px 0; width:100%; }
textarea { width:100%; height:150px; }
</style>
</head>
<body>

<div id="sidebar">
<h3>MUD World Map Editor Pro</h3>

<button onclick="addNode()">Add Area</button>
<button onclick="enableEdgeMode()">Connect Areas</button>
<button onclick="exportGraph()">Export world-graph.json</button>
<button onclick="exportMermaid()">Export Mermaid Graph</button>
<button onclick="importGraph()">Import JSON</button>

<h4>Output</h4>
<textarea id="json"></textarea>

</div>

<div id="canvas"></div>

<script>

let nodes=[]
let edges=[]
let idCounter=1
let connectMode=false
let selectedNode=null

function addNode(){

 const id="area_"+idCounter++
 const node={id,label:id,type:"area",x:120,y:120}
 nodes.push(node)
 drawNode(node)

}

function drawNode(node){

 const div=document.createElement("div")
 div.className="node"
 div.innerText=node.label
 div.style.left=node.x+"px"
 div.style.top=node.y+"px"
 div.dataset.id=node.id

 div.onclick=function(){

   if(connectMode){

      if(!selectedNode){
         selectedNode=node.id
         div.style.background="#ffd"
      }else{

         edges.push({from:selectedNode,to:node.id})
         selectedNode=null
         connectMode=false
         drawEdges()

      }

   }

 }

 div.onmousedown=function(e){

   const startX=e.clientX
   const startY=e.clientY

   const startLeft=parseInt(div.style.left)
   const startTop=parseInt(div.style.top)

   function move(ev){

      div.style.left=startLeft+(ev.clientX-startX)+"px"
      div.style.top=startTop+(ev.clientY-startY)+"px"

      const n=nodes.find(n=>n.id===node.id)
      n.x=parseInt(div.style.left)
      n.y=parseInt(div.style.top)

      drawEdges()

   }

   function up(){
      document.removeEventListener("mousemove",move)
      document.removeEventListener("mouseup",up)
   }

   document.addEventListener("mousemove",move)
   document.addEventListener("mouseup",up)

 }

 document.getElementById("canvas").appendChild(div)

}

function drawEdges(){

 document.querySelectorAll(".edge").forEach(e=>e.remove())

 edges.forEach(e=>{

   const a=nodes.find(n=>n.id===e.from)
   const b=nodes.find(n=>n.id===e.to)

   const line=document.createElement("div")
   line.className="edge"

   const x1=a.x+40
   const y1=a.y+10
   const x2=b.x+40
   const y2=b.y+10

   const length=Math.hypot(x2-x1,y2-y1)
   const angle=Math.atan2(y2-y1,x2-x1)*180/Math.PI

   line.style.width=length+"px"
   line.style.height="2px"
   line.style.background="#444"
   line.style.left=x1+"px"
   line.style.top=y1+"px"
   line.style.transform="rotate("+angle+"deg)"
   line.style.transformOrigin="0 0"

   document.getElementById("canvas").appendChild(line)

 })

}

function enableEdgeMode(){

 connectMode=true
 selectedNode=null
 alert("Click two nodes to connect them")

}

function exportGraph(){

 const graph={nodes:nodes.map(n=>({
   id:n.id,
   label:n.label,
   type:n.type
 })),edges:edges}

 document.getElementById("json").value=JSON.stringify(graph,null,2)

}

function exportMermaid(){

 let text="graph TD\n"

 edges.forEach(e=>{
   text+=e.from+" --> "+e.to+"\n"
 })

 document.getElementById("json").value=text

}

function importGraph(){

 try{

  const data=JSON.parse(document.getElementById("json").value)

  nodes=[]
  edges=data.edges||[]
  document.getElementById("canvas").innerHTML=""

  data.nodes.forEach(n=>{

     const node={...n,x:120,y:120}
     nodes.push(node)
     drawNode(node)

  })

  drawEdges()

 }catch(e){
   alert("Invalid JSON")
 }

}

</script>

</body>
</html>
