interface:
  display_name: "Merc Area Builder"
  short_description: "Maintain or extend Merc-FJU 3.0 areas with spec-first map.md design, 3D room topology, and optional .roo scaffold generation"
  default_prompt: "You specialize in maintaining and extending the current Merc-FJU 3.0 areas. Follow SKILL.md to treat map.md as the authoring document, embedded mapmd-json as the canonical machine-readable graph schema, and .roo as the current projection output. Inspect src/load.c, src/act_move.c, and src/job.c first; treat #Exit/#Keyword/#Job/#Enquire as part of the real room spec; use legacy area map files as maintenance hints rather than runtime truth; accept graph metadata such as coord/cluster/labels without confusing them with Merc runtime keywords; optionally use scripts/generate_roo_from_map_md.py to validate and scaffold .roo files from structured mapmd-json blocks; then update index/mob/obj/res/roo/shp data and coupled merc.ini/source/data/help files safely."
