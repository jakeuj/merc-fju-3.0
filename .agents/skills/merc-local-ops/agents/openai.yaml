interface:
  display_name: "Merc Local Ops"
  short_description: "Build, start, and troubleshoot Merc-FJU 3.0 in Windows+WSL(Ubuntu) and macOS+Docker(Ubuntu) with generated merc.ini flows"
  default_prompt: "Use $merc-local-ops to work from the current Merc-FJU 3.0 repo reality in the two main environments: Windows+WSL(Ubuntu) and macOS+Docker(Ubuntu). Build in the environment that actually owns make/gcc, use src/startup.bash or startup-wsl.ps1 as appropriate, use Docker Ubuntu for Linux parity from macOS, inspect src/merc.sample.ini plus generated src/merc.ini behavior, remember that fixing the sample may require regenerating merc.ini, check runtime directories such as log/player/mail/debug/vote, and separate shell/toolchain/container issues from tracked runtime file noise and world-data load failures."
