interface:
  display_name: "Merc Source Explainer"
  short_description: "Explain the current Merc-FJU 3.0 source tree, data loading, and .ski/pry runtime behavior from real files"
  default_prompt: "Use $merc-source-explainer to explain the current Merc-FJU 3.0 source tree in this workspace. Follow SKILL.md to inspect real src/, document/, skill/, data/, help/, and config files first; use docs/current-game/skill-file-format.md, skill-loader-reference.md, skill-constants.md, and skill-pry-crosswalk.md as the first-pass docs for .ski and pry questions; then verify against the actual C sources such as src/load.c, src/act_info.c, src/bit.c, src/class.c, and src/merc.h. Explain how merc.ini and gameplay data are loaded, point to the concrete files a developer should edit next, and when startup behavior is involved distinguish src/startup (legacy csh) from src/startup.bash (bash-only) while calling out wrong-shell issues such as zsh causing BASH_SOURCE errors."
